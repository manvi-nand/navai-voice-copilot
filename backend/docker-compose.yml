# LiveKit self-hosted for local dev (doc Open Question #3 -> Docker local).
# Start with:  docker compose up -d
# Dev creds (devkey/secret) match backend/.env.example and mobile config.
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    ports:
      - "7880:7880"       # WebSocket / API
      - "7881:7881"       # TCP RTC
      - "7882:7882/udp"   # UDP RTC
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
